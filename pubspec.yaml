dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Vazirmatn TTF files are NOT bundled here (binary font files can't be
  # generated by me without network access). Download the static weights
  # from https://fonts.google.com/specimen/Vazirmatn and drop them into
  # assets/fonts/ with these exact names before building — see README.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800

  assets:
    - assets/splash/splash_logo.png

# flutter_native_splash config — run `dart run flutter_native_splash:create` once
# after `flutter pub get` to generate the native splash screens (Android 12+ API too).
flutter_native_splash:
  color: "#ffffff"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#ffffff"
    image: assets/splash/splash_logo.png
  android: true
  ios: false
