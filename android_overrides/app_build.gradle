plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace "com.onespeed.onespeed"

    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.onespeed.onespeed"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def keystore = System.getenv("ONESPEED_KEYSTORE")

            if (keystore != null && !keystore.isEmpty()) {
                storeFile file(keystore)
                storePassword System.getenv("ONESPEED_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ONESPEED_KEY_ALIAS") ?: "onespeed"
                keyPassword System.getenv("ONESPEED_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def keystore = System.getenv("ONESPEED_KEYSTORE")

            signingConfig (
                keystore != null && !keystore.isEmpty()
                    ? signingConfigs.release
                    : signingConfigs.debug
            )

            minifyEnabled true
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }
}

flutter {
    source '../..'
}
