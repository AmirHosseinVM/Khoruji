def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // matches the package flutter create generates with --org com.onespeed --project-name onespeed
    namespace "com.onespeed.onespeed"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    defaultConfig {
        applicationId "com.onespeed.onespeed"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def hasKeystore = System.getenv("ONESPEED_KEYSTORE") != null
            storeFile hasKeystore ? file(System.getenv("ONESPEED_KEYSTORE")) : null
            storePassword System.getenv("ONESPEED_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ONESPEED_KEY_ALIAS") ?: "onespeed"
            keyPassword System.getenv("ONESPEED_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // No keystore yet? Falls back to the debug key automatically so
            // you can still get an installable APK today. Set the
            // ONESPEED_KEYSTORE* secrets later for a properly-signed build.
            signingConfig System.getenv("ONESPEED_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter { source '../..' }

dependencies {}
