name: Build OneSpeed APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Java 17
      # ---------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------
      # Flutter
      # ---------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------
      # Verify Flutter
      # ---------------------------------------------

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      # ---------------------------------------------
      # Generate Android project
      # ---------------------------------------------

      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org com.onespeed \
              --project-name onespeed \
              .
          fi

          test -d android
          echo "Android project ready."

      # ---------------------------------------------
      # Download fonts
      # ---------------------------------------------

      - name: Download Vazirmatn fonts
        run: |
          mkdir -p assets/fonts

          BASE="https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf"

          for WEIGHT in Regular Medium SemiBold Bold ExtraBold; do
            curl -fL \
              "$BASE/Vazirmatn-$WEIGHT.ttf" \
              -o "assets/fonts/Vazirmatn-$WEIGHT.ttf"
          done

          ls -lh assets/fonts

      # ---------------------------------------------
      # Apply icons
      # ---------------------------------------------

      - name: Apply OneSpeed icons
        run: |
          if [ -d "android_overrides/app/src/main/res" ]; then
            cp -rf \
              android_overrides/app/src/main/res/. \
              android/app/src/main/res/
          fi

      # ---------------------------------------------
      # Apply Manifest
      # ---------------------------------------------

      - name: Apply AndroidManifest
        run: |
          cp \
            android_overrides/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

      # ---------------------------------------------
      # Network security
      # ---------------------------------------------

      - name: Apply network security config
        run: |
          mkdir -p android/app/src/main/res/xml

          cp \
            android_overrides/network_security_config.xml \
            android/app/src/main/res/xml/network_security_config.xml

      # ---------------------------------------------
      # ProGuard
      # ---------------------------------------------

      - name: Apply ProGuard rules
        run: |
          cp \
            android_overrides/proguard-rules.pro \
            android/app/proguard-rules.pro

      # ---------------------------------------------
      # Custom Gradle
      # ---------------------------------------------

      - name: Apply OneSpeed Gradle configuration
        run: |
          cp \
            android_overrides/app_build.gradle \
            android/app/build.gradle

      # ---------------------------------------------
      # Check for unresolved conflicts
      # ---------------------------------------------

      - name: Check repository integrity
        run: |
          if grep -RniE \
            '^[<][<][<][<][<][<][<]|^[=][=][=][=][=][=][=]|^[>][>][>][>][>][>][>]' \
            . \
            --exclude-dir=.git \
            --exclude='*.lock'; then

            echo "ERROR: Git conflict markers detected."
            exit 1
          fi

          echo "No conflict markers found."

      # ---------------------------------------------
      # Dependencies
      # ---------------------------------------------

      - name: Flutter pub get
        run: flutter pub get

      # ---------------------------------------------
      # Analyze
      # ---------------------------------------------

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      # ---------------------------------------------
      # Build release APK
      # ---------------------------------------------

      - name: Build release APK
        run: |
          flutter build apk --release

      # ---------------------------------------------
      # Verify APK
      # ---------------------------------------------

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/

          test -f \
            build/app/outputs/flutter-apk/app-release.apk

      # ---------------------------------------------
      # Upload APK
      # ---------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneSpeed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
